# Netlify runs only the small Kairos money server (Apple Pay orders through Coinbase).
# The website itself is published by GitHub Pages (.github/workflows/publish.yml).
[build]
  base = "netlify"
  publish = "public"
  command = "npm test"

[functions]
  directory = "functions"
  node_bundler = "esbuild"

# The money server's own page: nothing to run, nothing to frame.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
