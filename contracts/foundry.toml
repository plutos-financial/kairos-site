[profile.default]
src = "src"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "read-write", path = "./deployments" }]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
remappings = ["@chainlink/=lib/chainlink-brownie-contracts/contracts/", "@openzeppelin/=lib/openzeppelin-contracts/", "forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 150

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }

[lint]
lint_on_build = false
