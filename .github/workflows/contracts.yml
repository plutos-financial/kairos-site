name: Test the contracts
# Every change to the contracts runs the full test suite: scenario tests, the brute-force draw check
# (1,000 randomized runs) and the invariant tests (256 runs x 150 random actions).
on:
  push:
    branches: [main]
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install libraries
        run: ./install-deps.sh
      - name: Build
        run: forge build --sizes
      - name: Test
        run: |
          set -o pipefail
          forge test 2>&1 | tee forge-test.txt
      - name: Show failing tests
        if: failure()
        run: |
          # each failing test (and its reason) as an annotation, readable without the full log
          grep -E "^\[FAIL|Error:|reverted|panicked|counterexample" forge-test.txt | head -20 | while IFS= read -r line; do echo "::error title=forge test::${line}"; done
          forge --version | head -1 | sed 's/^/::notice title=forge::/'
