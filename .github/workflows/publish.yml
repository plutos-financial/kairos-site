name: Publish the Kairos site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip the newest site zip
        run: |
          zip=""; newest=-1
          for f in *.zip; do
            [ -e "$f" ] || continue
            t=$(git log -1 --format=%ct -- "$f"); t=${t:-0}
            if [ "$t" -ge "$newest" ]; then newest=$t; zip="$f"; fi
          done
          if [ -z "$zip" ]; then echo "No .zip file found. Upload kairos-site.zip first."; exit 1; fi
          echo "Publishing $zip"
          rm -rf _unzipped _site && mkdir _unzipped _site
          unzip -q "$zip" -d _unzipped
          index=$(find _unzipped -name index.html -not -path '*__MACOSX*' | awk '{ print length($0) " " $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$index" ]; then echo "That zip has no index.html in it."; exit 1; fi
          cp -R "$(dirname "$index")"/. _site/
          touch _site/.nojekyll
          ls _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
